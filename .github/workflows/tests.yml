name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - name: Format isolated research files before validation
        if: github.ref == 'refs/heads/security/network-safety-research'
        run: |
          uv run ruff format tests/test_network_*.py utils/network_*.py

      - run: uv run pytest

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Commit verified formatting on research branch
        if: github.ref == 'refs/heads/security/network-safety-research' && github.actor != 'github-actions[bot]'
        run: |
          git add -- tests/test_network_*.py utils/network_*.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(security-research): Ruff format verified research files"
          git push origin HEAD:security/network-safety-research
