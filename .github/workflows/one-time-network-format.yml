name: One-time Research Ruff Formatting

on:
  push:
    branches:
      - security/network-safety-research

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Format only research files
        run: uv run ruff format tests/test_network_*.py utils/network_*.py
      - name: Verify tests and style before committing
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
      - name: Publish formatting to research branch
        run: |
          git add -- tests/test_network_*.py utils/network_*.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(security-research): apply Ruff formatting"
          git push origin HEAD:security/network-safety-research
