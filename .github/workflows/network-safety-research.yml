name: Network Safety Research
on:
  push:
    branches:
      - security/network-safety-research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked project dependencies
        run: uv sync --locked
      - name: Compile research modules
        run: uv run python -m compileall -q utils/network_safety.py utils/network_redirects.py utils/network_request_plan.py utils/network_transport.py
      - name: Run isolated offline security tests
        run: |
          uv run pytest -q \
            tests/test_network_safety_policy.py \
            tests/test_network_safety_urls.py \
            tests/test_network_redirects.py \
            tests/test_network_request_plan.py \
            tests/test_network_transport.py \
            tests/test_network_transport_adversarial.py
      - name: Verify Ruff lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
